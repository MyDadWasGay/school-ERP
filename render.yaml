services:
  - type: web
    name: school-erp-fastify-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run api:typecheck && npm run api:test
    startCommand: npm run api:start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONFIG_ENV
        value: staging
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PUBLIC_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: APP_ENCRYPTION_SECRET
        sync: false
      - key: INTERNAL_JOB_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_CALENDAR_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: MOODLE_BASE_URL
        sync: false
      - key: MOODLE_TOKEN
        sync: false
      - key: TRACCAR_BASE_URL
        sync: false
      - key: TRACCAR_TOKEN
        sync: false

  - type: worker
    name: school-erp-job-worker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run jobs:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_INTERNAL_BASE_URL
        sync: false
      - key: INTERNAL_JOB_SECRET
        sync: false
      - key: JOB_WORKER_INTERVAL_MS
        value: "10000"
