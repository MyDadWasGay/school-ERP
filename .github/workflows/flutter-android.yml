name: Flutter Android CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'FLUTTER APP/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  flutter-checks:
    name: Flutter checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FLUTTER APP
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=config/app_config.example.json

  android-release:
    name: Signed Android APK and AAB
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch')
    needs: flutter-checks
    environment: Production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FLUTTER APP
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate release configuration
        env:
          ERP_API_BASE_URL: ${{ vars.ERP_API_BASE_URL }}
          ERP_FIREBASE_API_KEY: ${{ vars.ERP_FIREBASE_API_KEY }}
          ERP_FIREBASE_APP_ID: ${{ vars.ERP_FIREBASE_APP_ID }}
          ERP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.ERP_FIREBASE_MESSAGING_SENDER_ID }}
          ERP_FIREBASE_PROJECT_ID: ${{ vars.ERP_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for variable in ERP_API_BASE_URL ERP_FIREBASE_API_KEY ERP_FIREBASE_APP_ID ERP_FIREBASE_MESSAGING_SENDER_ID ERP_FIREBASE_PROJECT_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing GitHub Production environment Variable: $variable" >&2
              exit 1
            fi
          done
          case "$ERP_API_BASE_URL" in
            https://*) ;;
            *) echo 'ERP_API_BASE_URL must use HTTPS for a production artifact.' >&2; exit 1 ;;
          esac

      - name: Smoke-test production API
        env:
          ERP_API_BASE_URL: ${{ vars.ERP_API_BASE_URL }}
        run: |
          set -euo pipefail
          api_base="${ERP_API_BASE_URL%/}"
          case "$api_base" in
            */api/v1) ;;
            *) api_base="$api_base/api/v1" ;;
          esac
          curl --fail --silent --show-error --location --max-time 20 \
            "$api_base/health/live" >/dev/null

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing GitHub Production environment Secret: $variable" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -noprompt >/dev/null

      - name: Build release APK
        env:
          ERP_API_BASE_URL: ${{ vars.ERP_API_BASE_URL }}
          ERP_FIREBASE_API_KEY: ${{ vars.ERP_FIREBASE_API_KEY }}
          ERP_FIREBASE_APP_ID: ${{ vars.ERP_FIREBASE_APP_ID }}
          ERP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.ERP_FIREBASE_MESSAGING_SENDER_ID }}
          ERP_FIREBASE_PROJECT_ID: ${{ vars.ERP_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="ERP_ENV=production" \
            --dart-define="ERP_API_BASE_URL=$ERP_API_BASE_URL" \
            --dart-define="ERP_FIREBASE_API_KEY=$ERP_FIREBASE_API_KEY" \
            --dart-define="ERP_FIREBASE_APP_ID=$ERP_FIREBASE_APP_ID" \
            --dart-define="ERP_FIREBASE_MESSAGING_SENDER_ID=$ERP_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="ERP_FIREBASE_PROJECT_ID=$ERP_FIREBASE_PROJECT_ID"

      - name: Build release app bundle
        env:
          ERP_API_BASE_URL: ${{ vars.ERP_API_BASE_URL }}
          ERP_FIREBASE_API_KEY: ${{ vars.ERP_FIREBASE_API_KEY }}
          ERP_FIREBASE_APP_ID: ${{ vars.ERP_FIREBASE_APP_ID }}
          ERP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.ERP_FIREBASE_MESSAGING_SENDER_ID }}
          ERP_FIREBASE_PROJECT_ID: ${{ vars.ERP_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="ERP_ENV=production" \
            --dart-define="ERP_API_BASE_URL=$ERP_API_BASE_URL" \
            --dart-define="ERP_FIREBASE_API_KEY=$ERP_FIREBASE_API_KEY" \
            --dart-define="ERP_FIREBASE_APP_ID=$ERP_FIREBASE_APP_ID" \
            --dart-define="ERP_FIREBASE_MESSAGING_SENDER_ID=$ERP_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="ERP_FIREBASE_PROJECT_ID=$ERP_FIREBASE_PROJECT_ID"

      - name: Generate SHA-256 checksums
        working-directory: .
        run: |
          set -euo pipefail
          sha256sum \
            'FLUTTER APP/build/app/outputs/flutter-apk/app-release.apk' \
            'FLUTTER APP/build/app/outputs/bundle/release/app-release.aab' \
            > android-artifacts.sha256

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: school-erp-android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            FLUTTER APP/build/app/outputs/flutter-apk/app-release.apk
            FLUTTER APP/build/app/outputs/bundle/release/app-release.aab
            android-artifacts.sha256
